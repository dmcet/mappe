name: mappe   # fixed project name: container and volume names don't depend on the folder

services:
  app:
    build:
      context: .
      target: runtime
    image: mappe:dev
    ports:
      - "127.0.0.1:8000:8000"   # local only
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}   # not needed with APP_DEMO=1
      APP_DEMO: ${APP_DEMO:-0}
      APP_DEMO_DELAY: ${APP_DEMO_DELAY:-0}  # seconds per sample "Claude call" in demo mode
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}     # optional job search source (free key)
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
    volumes:
      - crew-data:/data

volumes:
  crew-data:
    # Created before the rename to Mappe (project "application-crew"); the explicit name
    # keeps using it. Not "app-data": that name collides with an older, unrelated volume.
    name: application-crew_crew-data
