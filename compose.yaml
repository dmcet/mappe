name: mappe   # fixed project name: container and volume names don't depend on the folder

services:
  app:
    build:
      context: .
      target: runtime
    image: mappe:dev
    ports:
      - "127.0.0.1:8000:8000"   # local only
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}   # not needed with APP_DEMO=1
      APP_DEMO: ${APP_DEMO:-0}
      APP_DEMO_DELAY: ${APP_DEMO_DELAY:-0}  # seconds per sample "Claude call" in demo mode
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}     # optional job search source (free key)
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
    volumes:
      - data:/data

volumes:
  data: {}   # -> mappe_data. Data from before the rename was copied over from application-crew_crew-data.
