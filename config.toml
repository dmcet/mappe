# Application Crew configuration.
# Secrets (ANTHROPIC_API_KEY) come from the environment, never from this file.

[app]
data_dir = "/data"          # overridden by APP_DATA_DIR
max_concurrent_runs = 2

[review]
max_iterations = 4
stop_after_no_improvement = 2
recruiter_pass_score = 4.0  # average rubric score (1-5)
cost_limit_usd = 2.0        # per run; 0 = no limit

# Per-step model and effort. See docs/architecture.md, section 4.
[llm.default]
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 16000

[llm.steps.parse_cv]
effort = "low"

[llm.steps.parse_listing]
effort = "low"

[llm.steps.match]
effort = "high"

[llm.steps.author_cv]
effort = "high"

[llm.steps.author_letter]
effort = "medium"

[llm.steps.ats_judge]
effort = "low"

[llm.steps.recruiter]
effort = "medium"

[llm.steps.repair]
effort = "low"
