[project]
name = "mappe"
version = "0.1.0"
description = "Local web app that tailors ATS-friendly CVs and cover letters for IT jobs in Germany"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4,<3",
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "sse-starlette>=3.6",
    "sqlmodel>=0.0.48",
    "alembic>=1.20",
    "httpx>=0.28.1",
    "extruct>=0.18",
    "trafilatura>=2.3",
    "lingua-language-detector>=2.2",
    "rapidfuzz>=3.14",
    "fastembed>=0.9.1,<0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mappe"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"
