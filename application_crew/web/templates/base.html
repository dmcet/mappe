<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Application Crew{% endblock %}</title>
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/htmx-ext-sse.js" defer></script>
</head>
<body>
  <header><a href="/">Application Crew</a></header>
  {% if demo %}<div class="demo-banner" role="status">Demo mode: Claude is not called. Every CV is parsed as the same sample data (Jane Doe), not your CV.</div>{% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
